<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Converter – Prime Toolz</title>
<meta name="description" content="Convert images to JPG, PNG, WebP, GIF, BMP, TIFF directly in your browser.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
--primary:#0066ff;
--dark:#0052cc;
--bg:#f8fafc;
--white:#fff;
--gray:#64748b;
--border:#e2e8f0;
--radius:16px;
--shadow:0 10px 25px rgba(0,0,0,.08);
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
font-family:'Inter',sans-serif;
background:linear-gradient(135deg,#eef5ff,#f8fafc);
padding:20px;
color:#1e293b;
}

.container{max-width:1100px;margin:auto;}

header{text-align:center;margin-bottom:40px;}

.logo{
display:inline-flex;
align-items:center;
gap:12px;
background:#fff;
padding:14px 28px;
border-radius:50px;
box-shadow:var(--shadow);
margin-bottom:15px;
}

.logo i{
background:linear-gradient(135deg,var(--primary),#4d94ff);
color:#fff;
width:46px;height:46px;
display:flex;align-items:center;justify-content:center;
border-radius:50%;
}

.logo span{
font-family:'Poppins',sans-serif;
font-size:1.6rem;
font-weight:700;
background:linear-gradient(135deg,var(--primary),#4d94ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

@media(max-width:900px){.grid{grid-template-columns:1fr;}}

.card{
background:#fff;
border-radius:var(--radius);
padding:28px;
box-shadow:var(--shadow);
border:1px solid var(--border);
}

.card h2{
font-family:'Poppins',sans-serif;
margin-bottom:20px;
color:var(--primary);
display:flex;
align-items:center;
gap:10px;
}

.upload{
border:2px dashed var(--border);
border-radius:var(--radius);
padding:35px 20px;
text-align:center;
cursor:pointer;
background:#f1f5f9;
}

.upload:hover{border-color:var(--primary);background:#e6f0ff;}

.upload i{font-size:3.5rem;color:var(--primary);margin-bottom:12px;}

input[type=file]{display:none;}

.btn{
width:100%;
margin-top:15px;
padding:14px;
border-radius:50px;
border:none;
font-weight:600;
cursor:pointer;
color:#fff;
background:linear-gradient(135deg,var(--primary),#4d94ff);
}

.btn:hover{background:linear-gradient(135deg,var(--dark),var(--primary));}

.btn.secondary{
background:none;
color:var(--primary);
border:2px solid var(--primary);
}

.preview{
margin-top:20px;
background:#f1f5f9;
border-radius:12px;
padding:15px;
text-align:center;
}

.preview img{max-width:100%;max-height:240px;display:none;}

.setting{margin-bottom:18px;}

select, input[type=number]{
padding:10px;
border-radius:8px;
border:1px solid var(--border);
width:100%;
margin-top:8px;
}

.status{display:none;margin-top:15px;font-size:.9rem;}
.success{color:#10b981;}
.error{color:#ef4444;}

footer{text-align:center;margin-top:40px;color:var(--gray);font-size:.85rem;}
</style>
</head>

<body>
<div class="container">

<header>
<div class="logo"><i class="fas fa-exchange-alt"></i><span>Prime Toolz</span></div>
<h1>Image Converter</h1>
<p>Convert images to JPG, PNG, WebP, GIF, BMP, TIFF directly in your browser.</p>
</header>

<div class="grid">

<!-- Upload -->
<div class="card">
<h2><i class="fas fa-upload"></i> Upload</h2>
<div class="upload" id="uploadBox">
<i class="fas fa-image"></i>
<p>Drag & Drop Image</p>
<small>or click to browse</small>
<input type="file" id="fileInput" accept="image/*">
</div>
<button class="btn" id="browseBtn">Browse File</button>
<div class="preview">
<span id="noImg">No image selected</span>
<img id="previewImg">
</div>
</div>

<!-- Settings -->
<div class="card">
<h2><i class="fas fa-sliders-h"></i> Settings</h2>
<div class="setting">
<label>Convert To Format:</label>
<select id="format">
<option value="image/jpeg">JPG</option>
<option value="image/png">PNG</option>
<option value="image/webp">WebP</option>
<option value="image/gif">GIF</option>
<option value="image/bmp">BMP</option>
<option value="image/tiff">TIFF</option>
</select>
</div>

<div class="setting">
<label>Resize (optional)</label>
<div class="row">
<input type="number" id="width" placeholder="Width">
<input type="number" id="height" placeholder="Height">
</div>
</div>

<button class="btn" id="convertBtn">Convert Image</button>
<button class="btn secondary" id="downloadBtn" disabled>Download</button>

<div class="status success" id="success">Image converted successfully</div>
<div class="status error" id="error"></div>
</div>

</div>

<footer>© <span id="year"></span> Prime Toolz</footer>
</div>

<script>
const fileInput=document.getElementById('fileInput');
const browseBtn=document.getElementById('browseBtn');
const uploadBox=document.getElementById('uploadBox');
const previewImg=document.getElementById('previewImg');
const noImg=document.getElementById('noImg');
const widthInput=document.getElementById('width');
const heightInput=document.getElementById('height');
const convertBtn=document.getElementById('convertBtn');
const downloadBtn=document.getElementById('downloadBtn');
const formatSelect=document.getElementById('format');
const success=document.getElementById('success');
const error=document.getElementById('error');

let img=new Image();
let outputURL=null;

document.getElementById('year').textContent=new Date().getFullYear();

browseBtn.onclick=()=>fileInput.click();
uploadBox.onclick=()=>fileInput.click();

fileInput.onchange=()=>{
const file=fileInput.files[0];
if(!file) return;

const reader=new FileReader();
reader.onload=e=>{
img.src=e.target.result;
previewImg.src=e.target.result;
previewImg.style.display='block';
noImg.style.display='none';
error.style.display='none';
};
reader.readAsDataURL(file);
};

convertBtn.onclick=()=>{
if(!img.src){
error.textContent='Please upload an image first';
error.style.display='block';
return;
}

const canvas=document.createElement('canvas');
const w=widthInput.value||img.width;
const h=heightInput.value||img.height;
canvas.width=w;
canvas.height=h;
const ctx=canvas.getContext('2d');
ctx.drawImage(img,0,0,w,h);

const format=formatSelect.value;
outputURL=canvas.toDataURL(format);

downloadBtn.disabled=false;
success.style.display='block';
error.style.display='none';
};

downloadBtn.onclick=()=>{
const a=document.createElement('a');
a.href=outputURL;
const ext=formatSelect.value.split('/')[1];
a.download='converted.'+ext;
a.click();
};
</script>
</body>
</html>
